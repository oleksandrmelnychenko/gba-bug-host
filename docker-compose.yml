services:
  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      PORT: 4000
      APP_BUILD_NUMBER: "${APP_BUILD_NUMBER:?Set APP_BUILD_NUMBER in the server environment}"
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/public/uploads
      BUILD_SOURCE_URL: "${BUILD_SOURCE_URL:-http://host.docker.internal:8083}"
      CODEX_RUN_STALE_MS: "${CODEX_RUN_STALE_MS:-30000}"
      QA_DESK_AUTH_REQUIRED: "true"
      QA_DESK_INTERNAL_API_TOKEN: "${QA_DESK_INTERNAL_API_TOKEN:?Set QA_DESK_INTERNAL_API_TOKEN in the server environment}"
      VOICE_TRANSCRIBE_MODEL: "${VOICE_TRANSCRIBE_MODEL:-base}"
      VOICE_TRANSCRIBE_DEVICE: "${VOICE_TRANSCRIBE_DEVICE:-cpu}"
      VOICE_TRANSCRIBE_COMPUTE_TYPE: "${VOICE_TRANSCRIBE_COMPUTE_TYPE:-int8}"
      VOICE_TRANSCRIBE_TIMEOUT_MS: "${VOICE_TRANSCRIBE_TIMEOUT_MS:-180000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${DOCKER_GID:-983}"
    ports:
      - "127.0.0.1:${QA_DESK_PORT:-4000}:4000"
    networks:
      - default
      - caddy
      - devstack
    volumes:
      - qa-data:/app/data
      - qa-uploads:/app/public/uploads
      - /var/run/docker.sock:/var/run/docker.sock:ro

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      - web
    environment:
      APP_BUILD_NUMBER: "${APP_BUILD_NUMBER:?Set APP_BUILD_NUMBER in the server environment}"
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/public/uploads
      CODEX_TARGET_REPO: "${CODEX_TARGET_REPO_HOST_PATH:?Set CODEX_TARGET_REPO_HOST_PATH}"
      CODEX_WORKTREES_DIR: "${CODEX_WORKTREES_HOST_PATH:?Set CODEX_WORKTREES_HOST_PATH}"
      CODEX_HOME: /app/codex-home
      CODEX_NETWORK_ACCESS: "${CODEX_NETWORK_ACCESS:-true}"
      CODEX_JOB_TIMEOUT_MS: "${CODEX_JOB_TIMEOUT_MS:-2700000}"
      CODEX_MODEL: "${CODEX_MODEL:-gpt-6-sol}"
      CODEX_BASELINE_SOURCE: "${CODEX_BASELINE_SOURCE:-origin}"
      # Pinned explicitly so a host-wide max/ultra setting cannot spend the
      # whole job timeout before the first repository check.
      CODEX_REASONING_EFFORT: "${CODEX_REASONING_EFFORT:-medium}"
      CODEX_CONCURRENCY: "${CODEX_CONCURRENCY:-2}"
      CODEX_REASONING_EFFORT_ESCALATED: "${CODEX_REASONING_EFFORT_ESCALATED:-xhigh}"
      CODEX_REPOS_CONSOLE: "${CODEX_TARGET_REPO_HOST_PATH:?Set CODEX_TARGET_REPO_HOST_PATH},${CODEX_SERVER_REPO_HOST_PATH:?Set CODEX_SERVER_REPO_HOST_PATH}"
      CODEX_REPOS_ECOMMERCE: "${CODEX_ECOMMERCE_REPO_HOST_PATH:?Set CODEX_ECOMMERCE_REPO_HOST_PATH},${CODEX_ECOMMERCE_API_REPO_HOST_PATH:?Set CODEX_ECOMMERCE_API_REPO_HOST_PATH}"
      CODEX_REFERENCE_REPOS_CONSOLE: "${CODEX_REFERENCE_REPOS_CONSOLE:-}"
      CODEX_REFERENCE_REPOS_ECOMMERCE: "${CODEX_REFERENCE_REPOS_ECOMMERCE:-}"
      CODEX_WORKER_LEASE_NAME: "${CODEX_WORKER_LEASE_NAME:-codex-worker}"
      CODEX_WORKER_LEASE_TTL_MS: "${CODEX_WORKER_LEASE_TTL_MS:-20000}"
      CODEX_WORKER_HEARTBEAT_MS: "${CODEX_WORKER_HEARTBEAT_MS:-5000}"
      QA_DEV_API_PROXY_URL: "${QA_DEV_API_PROXY_URL:-http://dev-api-proxy:8790}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY in the server environment}"
    # exec makes Node PID 1 after login, so SIGTERM reaches the graceful lease
    # release handler during recreate instead of leaving a 20s stale lease.
    command: ["sh", "-lc", "printf '%s' \"$$OPENAI_API_KEY\" | codex login --with-api-key && exec node server/worker.js"]
    volumes:
      - qa-data:/app/data
      - qa-uploads:/app/public/uploads
      - codex-home:/app/codex-home
      # AGENTS.md requires every worker shell command to go through RTK.
      # Fail closed when the host tool was not configured and mount it read-only.
      - "${RTK_HOST_PATH:?Set RTK_HOST_PATH}:/usr/local/bin/rtk:ro"
      - "${CODEX_TARGET_REPO_HOST_PATH:?Set CODEX_TARGET_REPO_HOST_PATH}:${CODEX_TARGET_REPO_HOST_PATH:?Set CODEX_TARGET_REPO_HOST_PATH}"
      - "${CODEX_SERVER_REPO_HOST_PATH:?Set CODEX_SERVER_REPO_HOST_PATH}:${CODEX_SERVER_REPO_HOST_PATH:?Set CODEX_SERVER_REPO_HOST_PATH}"
      - "${CODEX_ECOMMERCE_REPO_HOST_PATH:?Set CODEX_ECOMMERCE_REPO_HOST_PATH}:${CODEX_ECOMMERCE_REPO_HOST_PATH:?Set CODEX_ECOMMERCE_REPO_HOST_PATH}"
      - "${CODEX_ECOMMERCE_API_REPO_HOST_PATH:?Set CODEX_ECOMMERCE_API_REPO_HOST_PATH}:${CODEX_ECOMMERCE_API_REPO_HOST_PATH:?Set CODEX_ECOMMERCE_API_REPO_HOST_PATH}"
      - "${CODEX_WORKTREES_HOST_PATH:?Set CODEX_WORKTREES_HOST_PATH}:${CODEX_WORKTREES_HOST_PATH:?Set CODEX_WORKTREES_HOST_PATH}"

  dev-api-proxy:
    build:
      context: .
      target: app-runtime
    restart: unless-stopped
    command: ["node", "server/dev-api-proxy.js"]
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DEV_API_PROXY_PORT: "8790"
      DEV_API_CONCORD_UPSTREAM: "${DEV_API_CONCORD_UPSTREAM:-http://gba-dev-data-concord-1:35981}"
      DEV_API_ANALYTICS_UPSTREAM: "${DEV_API_ANALYTICS_UPSTREAM:-http://gba-dev-data-analytics-1:35982}"
      DEV_API_OPERATOR_TOKEN_FILE: /run/dev-api/operator-token.json
      DEV_API_JWT_KEY_FILE: /run/dev-api/jwt-key
      DEV_API_JWT_PRIVATE_KEY_FILE: /run/dev-api/jwt-private-key
      DEV_API_OPERATOR_NET_ID: "${DEV_API_OPERATOR_NET_ID:?Set DEV_API_OPERATOR_NET_ID}"
    ports:
      - "127.0.0.1:${DEV_API_PROXY_PORT:-4010}:8790"
    networks:
      - default
      - devstack
    volumes:
      - "${DEV_API_OPERATOR_TOKEN_FILE:?Set DEV_API_OPERATOR_TOKEN_FILE}:/run/dev-api/operator-token.json:ro"
      - "${DEV_API_JWT_KEY_FILE:?Set DEV_API_JWT_KEY_FILE}:/run/dev-api/jwt-key:ro"
      - "${DEV_API_JWT_PRIVATE_KEY_FILE:?Set DEV_API_JWT_PRIVATE_KEY_FILE}:/run/dev-api/jwt-private-key:ro"

  sentinel:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      - web
    user: "0:0"
    command: ["npm", "run", "sentinel"]
    environment:
      DATA_DIR: /app/data
      SENTINEL_DESK_URL: http://web:4000
      APP_BUILD_NUMBER: "${APP_BUILD_NUMBER:?Set APP_BUILD_NUMBER in the server environment}"
      SENTINEL_CONTAINERS: "${SENTINEL_CONTAINERS:-}"
      SENTINEL_IGNORE: "${SENTINEL_IGNORE:-}"
      SENTINEL_MAX_PER_HOUR: "${SENTINEL_MAX_PER_HOUR:-4}"
      SENTINEL_MAINTENANCE_ENV: "${SENTINEL_MAINTENANCE_ENV:-}"
      SENTINEL_MAINTENANCE_FENCES: "${SENTINEL_MAINTENANCE_FENCES:-}"
      SENTINEL_MAINTENANCE_DEPENDENCIES: "${SENTINEL_MAINTENANCE_DEPENDENCIES:-}"
      SENTINEL_MAINTENANCE_GRACE_MS: "${SENTINEL_MAINTENANCE_GRACE_MS:-120000}"
      QA_DESK_INTERNAL_API_TOKEN: "${QA_DESK_INTERNAL_API_TOKEN:?Set QA_DESK_INTERNAL_API_TOKEN in the server environment}"
    volumes:
      - qa-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  qa-data:
  qa-uploads:
  codex-home:

networks:
  caddy:
    name: gba-prod_default
    external: true
  devstack:
    name: gba-dev_default
    external: true
